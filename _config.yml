title: From the Simulation
# Explicit description. Without this, jekyll-seo-tag falls back to the GitHub
# repo description ("My Technical Blog") for <meta name="description">.
description: ""
author:
  name: Srujan Jonnadula
# GitHub Pages serves this site from a subpath, so baseurl MUST be set or every
# generated link (css, posts, about, feed) 404s.
baseurl: "/fromthesimulation"
url: "https://jonnadul.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
timezone: America/Los_Angeles
encoding: utf-8

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false

exclude:
  - tools/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .git/
  - .gitignore

# Keep drafts out of the built site
unpublished: false

# Pagination-free simple listing on the homepage
sass:
  style: compressed
