title: From the Simulation
# Explicit description. Without this, jekyll-seo-tag falls back to the GitHub
# repo description ("My Technical Blog") for <meta name="description">.
description: "Notes on AI agents, cloud security, and the systems we build."
author:
  name: Srujan Jonnadula
# Custom domain: fromthesimulation.blog
# With a custom domain the site is served from the domain root, so baseurl
# must be EMPTY -- leaving the old "/fromthesimulation" here would make every
# generated link 404 at the new domain (or serve as /fromthesimulation/...).
baseurl: ""
url: "https://fromthesimulation.blog"

# Build settings
markdown: kramdown
highlighter: rouge
timezone: America/Los_Angeles
encoding: utf-8

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Defaults for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false

exclude:
  - tools/
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .git/
  - .gitignore

# Keep drafts out of the built site
unpublished: false

# Pagination-free simple listing on the homepage
sass:
  style: compressed
